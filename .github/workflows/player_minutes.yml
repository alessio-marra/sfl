name: Continuous Player Minutes Pipeline

on:
  schedule:
    # Runs daily at 04:00 UTC (05:00 CET / 06:00 CEST)
    - cron: "0 4 * * *"
  workflow_dispatch: # Allows manual trigger directly from the GitHub UI

# Global environment parameters
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      - name: Initialize Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Runtime Requirements
        run: pip install requests

      - name: Execute Minutes State Script
        env:
          SP_API_KEY: ${{ secrets.SP_API_KEY }}
          SP_REFERER: ${{ secrets.SP_REFERER }}
          PLAYERS_FILE: "players.json"
        run: python player_minutes.py

      - name: Commit State Changes Back to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Commit only if database file variations occur
          git diff-index --quiet HEAD || git commit -m "Automated updates to minutes_state.json [skip ci]"
          git push origin main || echo "No changes or push skipped"

      - name: Setup GitHub Pages View Environment
        uses: actions/configure-pages@v5

      - name: Upload Finished Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads index.html from the root folder straight to deployment engines
          path: '.'

      - name: Publish Live to GitHub Pages
        uses: actions/deploy-pages@v4
