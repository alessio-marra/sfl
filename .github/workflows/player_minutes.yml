name: player-minutes

on:
  workflow_dispatch:
    inputs:
      tournament_calendar_id:
        description: "Tournament Calendar ID"
        required: true
      player_id:
        description: "Player ID"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run player minutes check
        env:
          SP_API_KEY:             ${{ secrets.SP_API_KEY }}
          SP_REFERER:             ${{ secrets.SP_REFERER }}
          TOURNAMENT_CALENDAR_ID: ${{ github.event.inputs.tournament_calendar_id }}
          PLAYER_ID:              ${{ github.event.inputs.player_id }}
        run: python player_minutes.py

      - name: Upload output as artifact
        uses: actions/upload-artifact@v5
        with:
          name: player-minutes-${{ github.event.inputs.player_id }}
          path: player_minutes_output.csv
          retention-days: 30
