name: player-minutes

on:
  workflow_dispatch:
    inputs:
      tournament_calendar_1:
        description: "Tournament Calendar ID 1 (e.g. Super League)"
        required: true
      tournament_calendar_2:
        description: "Tournament Calendar ID 2 (e.g. Challenge League)"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run player minutes check
        env:
          SP_API_KEY:             ${{ secrets.SP_API_KEY }}
          SP_REFERER:             ${{ secrets.SP_REFERER }}
          TOURNAMENT_CALENDAR_1:  ${{ github.event.inputs.tournament_calendar_1 }}
          TOURNAMENT_CALENDAR_2:  ${{ github.event.inputs.tournament_calendar_2 }}
          PLAYERS_FILE:           players.json
        run: python player_minutes.py

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: player-minutes-report
          path: player_minutes_output.html
          retention-days: 30
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Commit updated competition_mapping.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competition_mapping.json || true
          git diff --staged --quiet || git commit -m "chore: update competition_mapping.json [skip ci]"
          git push
