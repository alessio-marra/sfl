name: Check Substitution Changes

on:
  schedule:
    # Runs at 05:00 and 17:00 UTC = 06:00 and 18:00 CET (winter) / 07:00 and 19:00 CEST (summer)
    - cron: "0 5 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  check-subs:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit state.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run substitution check
        env:
          SP_API_KEY:       ${{ secrets.SP_API_KEY }}
          SP_REFERER:       ${{ secrets.SP_REFERER }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO_TEST }}
          LOOKBACK_HOURS:   "13"
        run: python check_substitutions.py

      - name: Commit updated state.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit if state.json actually changed
          git diff --cached --quiet || git commit -m "chore: update substitution state [skip ci]"
          git push
