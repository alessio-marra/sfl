name: Reset State - Remove Old Season

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Filter state.json to current season only
        run: |
          python3 - << 'EOF'
          import json
          from pathlib import Path

          state = json.loads(Path("state.json").read_text())
          print(f"Before: {len(state)} matches")

          # Keep only matches from 2026-07-01 onwards (new season)
          filtered = {
              k: v for k, v in state.items()
              if v.get("date", "") >= "2026-07-01"
          }
          print(f"After: {len(filtered)} matches")

          Path("state.json").write_text(
              json.dumps(filtered, indent=2, ensure_ascii=False)
          )
          EOF
      - name: Commit filtered state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: remove old season matches from state.json [skip ci]"
          git push origin main
