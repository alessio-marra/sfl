name: check-match-schedule

on:
  schedule:
    - cron: "0 * * * *"   # Every hour
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests msal

      - name: Run schedule check
        env:
          SP_API_KEY:           ${{ secrets.SP_API_KEY }}
          SP_REFERER:           ${{ secrets.SP_REFERER }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_SCHEDULE:    ${{ secrets.EMAIL_TO_SCHEDULE }}
          AZURE_TENANT_ID:      ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:      ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:  ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python check_schedule.py

      - name: Commit updated schedule_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule_state.json
          git diff --staged --quiet || git commit -m "chore: update schedule state [skip ci]"
          git push origin main || echo "No changes"
